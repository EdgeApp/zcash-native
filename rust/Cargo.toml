[package]
name = "edge-zcash"
version = "0.13.2"
edition = "2024"
publish = false

[lib]
name = "zcash"
crate-type = ["cdylib", "staticlib"]

[features]
default = ["napi-backend"]
napi-backend = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
uniffi-backend = ["dep:uniffi", "dep:thiserror"]

[dependencies]
bip0039 = { version = "0.14", features = ["rand"] }
hex = "0.4"
http = "1"
json = "0.12"
napi = { version = "2.16", default-features = false, features = [
    "napi8",
    "async",
    "tokio_rt",
], optional = true }
napi-derive = { version = "2.16", optional = true }
nonempty = "0.11"
once_cell = "1"
pepper-sync = { git = "https://github.com/EdgeApp/zingolib", rev = "c8ceeb921c10d95da46d32c475730ac7537e8341" }
# The Sapling parameter download. The webpki roots and the absent provider
# follow zingolib: `ensure_default_crypto_provider` installs aws-lc-rs.
reqwest = { version = "0.12.15", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
] }
tempfile = "3"
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "sync"] }
uniffi = { version = "0.29", optional = true, features = ["cli"] }
zcash_address = "=0.14.0"
zcash_client_backend = { version = "=0.25.0", default-features = false, features = [
    "orchard",
    "transparent-inputs",
] }
zcash_keys = { version = "=0.17.0", features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }
zcash_protocol = "=0.11.0"
zingolib = { git = "https://github.com/EdgeApp/zingolib", rev = "c8ceeb921c10d95da46d32c475730ac7537e8341", default-features = false, features = [
    "runtime-sapling-params",
] }
zingo-status = { git = "https://github.com/EdgeApp/zingolib", rev = "c8ceeb921c10d95da46d32c475730ac7537e8341" }
zip32 = "0.3"

[build-dependencies]
napi-build = { version = "2.1", optional = true }
uniffi = { version = "0.29", optional = true, features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-backend"]

# The iOS app links every native module into one binary, and an ARM64 direct
# branch reaches 128 MB, so each module has to leave room for the others.
# Optimizing for size also keeps the published package down: the unoptimized
# build produced a 147 MB static library per slice.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# Deliberately not `panic = "abort"`: both backends turn a Rust panic into a
# host-side error, and aborting would take the app down instead.
